name: chicken_up
description: "Chicken Up — corrida da galinha (reescrita em Flutter/Dart)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Motor 2D do jogo (loop, componentes, input).
  flame: ^1.23.0
  # Persistência local (equivalente ao localStorage da versão web).
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
