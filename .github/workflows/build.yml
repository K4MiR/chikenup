name: Build signed APK

# Builda o APK de release, assinado com a keystore guardada nos secrets do
# repositorio. Rode "Generate signing keystore" (uma vez) e configure os 4
# secrets ANTES do primeiro build aqui (ver instrucoes naquele workflow).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check signing secrets are configured
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 nao configurado. Rode o workflow 'Generate signing keystore' primeiro e configure os secrets (ver README)."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Scaffold Android platform folder
        run: flutter create --platforms=android --org com.shiftcriativo --project-name chickenup .

      - name: Patch Gradle signing config
        run: python3 scripts/patch_gradle_signing.py

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chickenup-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: chickenup-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
