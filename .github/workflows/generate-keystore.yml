name: Generate signing keystore

# Roda manualmente UMA VEZ (aba Actions > Generate signing keystore > Run workflow).
# Gera uma keystore nova com senhas aleatorias e disponibiliza como artifact
# para download. Depois de baixar, configure os 4 secrets do repositorio
# (Settings > Secrets and variables > Actions) usando os valores do arquivo
# keystore-info.txt que vem dentro do zip:
#   KEYSTORE_BASE64   -> conteudo base64 do arquivo .jks (tambem incluso no zip)
#   KEYSTORE_PASSWORD -> senha da keystore
#   KEY_ALIAS         -> alias da chave
#   KEY_PASSWORD      -> senha da chave
on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore with random passwords
        run: |
          set -e
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          ALIAS="chickenup-release"

          keytool -genkeypair -v \
            -keystore chickenup-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Chicken Up, OU=ShiftCriativo, O=ShiftCriativo, L=BR, S=BR, C=BR"

          base64 -i chickenup-release.jks -o chickenup-release.jks.base64

          {
            echo "KEYSTORE_BASE64: (conteudo do arquivo chickenup-release.jks.base64 anexo)"
            echo "KEYSTORE_PASSWORD: $STORE_PASS"
            echo "KEY_ALIAS: $ALIAS"
            echo "KEY_PASSWORD: $KEY_PASS"
            echo ""
            echo "Guarde isso em local seguro (gerenciador de senhas). Sem isso"
            echo "voce nao consegue publicar atualizacoes do mesmo app na Play Store."
          } > keystore-info.txt

      - name: Upload keystore artifact (download manual, nao fica no repo)
        uses: actions/upload-artifact@v4
        with:
          name: chickenup-keystore
          path: |
            chickenup-release.jks
            chickenup-release.jks.base64
            keystore-info.txt
          retention-days: 7
