name: (Capacitor) Gerar nova upload key

# Gera uma NOVA upload key para o app Capacitor e ja exporta o certificado
# .pem que o Google pede no processo de "redefinicao de chave de upload".
#
# Fluxo completo:
#  1. Rode este workflow.
#  2. Copie do resumo: as senhas e o conteudo do .pem.
#  3. Envie o .pem ao Google no formulario de reset da upload key.
#  4. Configure os secrets LEGACY_KEYSTORE_* (ver abaixo).
#  5. Quando o Google confirmar o reset, rode o workflow de build.
#
# Secrets a configurar depois:
#   LEGACY_KEYSTORE_BASE64, LEGACY_KEYSTORE_PASSWORD, LEGACY_KEY_ALIAS
on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar keystore + certificado para o Google
        run: |
          set -e
          # PKCS12 nao aceita senha diferente para store e key.
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          ALIAS="chickenup-upload"

          keytool -genkeypair -v \
            -keystore chickenup-upload.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Chicken Up, OU=ShiftCriativo, O=ShiftCriativo, L=BR, S=BR, C=BR"

          # Certificado que o Google pede no reset da upload key
          keytool -export -rfc \
            -keystore chickenup-upload.jks \
            -alias "$ALIAS" \
            -storepass "$PASS" \
            -file upload_certificate.pem

          base64 -w 0 chickenup-upload.jks > chickenup-upload.jks.base64

          {
            echo "## Nova upload key gerada"
            echo ""
            echo "### 1) Guarde estas senhas (gerenciador de senhas)"
            echo '```'
            echo "LEGACY_KEYSTORE_PASSWORD: $PASS"
            echo "LEGACY_KEY_ALIAS: $ALIAS"
            echo '```'
            echo ""
            echo "### 2) Envie este certificado ao Google (reset da upload key)"
            echo "Salve o bloco abaixo como \`upload_certificate.pem\` e anexe no formulario:"
            echo ""
            echo '```'
            cat upload_certificate.pem
            echo '```'
            echo ""
            echo "### 3) Configure o secret LEGACY_KEYSTORE_BASE64 com o valor abaixo"
            echo ""
            echo "---BASE64-START---"
            cat chickenup-upload.jks.base64
            echo ""
            echo "---BASE64-END---"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dos arquivos
        uses: actions/upload-artifact@v4
        with:
          name: chickenup-upload-key
          path: |
            chickenup-upload.jks
            chickenup-upload.jks.base64
            upload_certificate.pem
          retention-days: 7
